<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of Julia Cassandra U. Alemania, BS Information Technology student.">

  <meta name="theme-color" content="#0B6FA4">

  <!-- Link preview (WhatsApp, Messenger, LinkedIn, Facebook, X) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Julia Cassandra Alemania | Portfolio">
  <meta property="og:description" content="BS Information Technology student. Skills, certifications, projects, and contact details.">
  <meta property="og:url" content="https://lcct-24-13115.github.io/my_portfolio/">
  <meta property="og:image" content="https://lcct-24-13115.github.io/my_portfolio/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Julia Cassandra Alemania | Portfolio">
  <meta name="twitter:description" content="BS Information Technology student. Skills, certifications, projects, and contact details.">
  <meta name="twitter:image" content="https://lcct-24-13115.github.io/my_portfolio/preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Julia Alemania">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>
  <link rel="icon" href="favicon.ico?v=2" sizes="any"/>

  <title>Julia Cassandra Alemania | Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #101418; }
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(11, 111, 164, 0.2);
      border-top-color: #0B6FA4;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame. -->
  <div id="loading" role="status" aria-label="Loading portfolio">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
